<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Portada de reel 9:16" description="1080×1920 · foto B/W a sangre · título en la zona segura central (visible también en el recorte 4:5 del feed) · zonas de UI de Instagram marcadas" -->
<helmet><script src="./ds-base.js"></script><script src="../shared/image-slot.js"></script><style>body{margin:0;background:#F1F1F1}</style></helmet>
<div ref="{{ rootRef }}" style="width:1080px;height:1920px;background:#000000;position:relative;overflow:hidden;font-family:Roboto,system-ui,sans-serif;color:#FFFFFF">
<div data-zone="photo" style="position:absolute;inset:0;filter:grayscale(1)"><image-slot id="reel-photo" shape="rect" placeholder="Fotografía vertical · rostro en el tercio superior"></image-slot></div>
<div data-zone="scrim" style="position:absolute;left:0;right:0;bottom:0;height:900px;background:#000000;opacity:.0"></div>
<div style="position:absolute;left:108px;right:108px;top:300px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;pointer-events:none"><span style="font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;">Reel</span><img src="../../assets/logo/svg/fama-academy-horizontal-white.svg" alt="FAMA Academy" style="height:28px"><span style="font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;text-align:right">Madrid · Barcelona</span></div>
<div data-zone="text" style="position:absolute;left:108px;right:108px;bottom:520px;display:flex;flex-direction:column;gap:28px">
<span style="display:inline-block;align-self:flex-start;font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;border-top:1px solid currentColor;padding-top:14px;opacity:.8">01 · Openday</span>
<div data-zone="title" style="font:800 150px/0.86 Syne,Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-0.05em" data-fit="1">¿Vales para modelo?</div>
<div style="font:300 40px/1.2 'Space Grotesk',Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.14em;max-width:20ch">Descúbrelo en 3 horas</div>
</div>
<div data-zone="guides" style="position:absolute;inset:0;pointer-events:none;display:none">
<div style="position:absolute;left:0;right:0;top:0;height:250px;border-bottom:1px dashed rgba(255,255,255,.5)"><span style="position:absolute;right:16px;bottom:8px;font:500 12px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;opacity:.6">UI Instagram · no texto</span></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:420px;border-top:1px dashed rgba(255,255,255,.5)"><span style="position:absolute;right:16px;top:8px;font:500 12px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;opacity:.6">Caption · botones · no texto</span></div>
<div style="position:absolute;left:0;right:0;top:285px;height:1350px;border-top:1px solid rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.35)"><span style="position:absolute;left:16px;top:8px;font:500 12px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;opacity:.6">Recorte 4:5 del feed</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;showGuides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;scrim&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:0.6,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Photo&quot;},&quot;blackAndWhite&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Photo&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() { this.apply(); this.fitAll(); if (document.fonts) document.fonts.ready.then(() => this.fitAll()); window.addEventListener('resize', () => this.fitAll()); }
  componentDidUpdate() { this.apply(); this.fitAll(); }
  apply() {
    const r = this.rootRef.current; if (!r) return;
    const q = z => r.querySelector('[data-zone="' + z + '"]');
    q('guides').style.display = (this.props.showGuides ?? true) ? 'block' : 'none';
    q('photo').style.filter = (this.props.blackAndWhite ?? true) ? 'grayscale(1)' : 'none';
    q('scrim').style.opacity = String(this.props.scrim ?? 0);
  }
  fitAll() {
    const r = this.rootRef.current; if (!r) return;
    r.querySelectorAll('[data-fit]').forEach(h => {
      const p = h.parentElement, cs = getComputedStyle(p);
      const box = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); if (box <= 0) return;
      if (!h.dataset.max) h.dataset.max = parseFloat(getComputedStyle(h).fontSize);
      const probe = document.createElement('span'); probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit';
      const nowrap = getComputedStyle(h).whiteSpace === 'nowrap';
      const words = h.textContent.trim().split(/\s+/); probe.textContent = nowrap ? words.join(' ') : words.reduce((a, b) => b.length > a.length ? b : a, '');
      h.appendChild(probe); let s = +h.dataset.max; h.style.fontSize = s + 'px';
      while (s > 20 && probe.getBoundingClientRect().width > box) { s -= 2; h.style.fontSize = s + 'px'; }
      probe.remove();
    });
  }
  renderVals() { return { rootRef: this.rootRef }; }
}
</script>
</body>
</html>
