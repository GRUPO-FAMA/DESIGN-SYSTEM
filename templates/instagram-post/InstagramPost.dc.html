<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Instagram post 4:5" description="1080×1350 · photo hero (B/W) + editorial title band · Syne + Space Grotesk Light · 10% margins" -->
<helmet><script src="./ds-base.js"></script><script src="../shared/image-slot.js"></script><style>body{margin:0;background:#F1F1F1}</style></helmet>
<div ref="{{ rootRef }}" style="width:1080px;height:1350px;background:#FFFFFF;position:relative;overflow:hidden;font-family:Roboto,system-ui,sans-serif;color:#000000">
<div data-zone="photo" style="position:absolute;left:0;top:0;width:1080px;height:810px;filter:grayscale(1)"><image-slot id="ig-post-photo" shape="rect" placeholder="Fotografía editorial · rostro fuera de la franja inferior"></image-slot></div>
<div style="position:absolute;left:108px;right:108px;top:108px;display:flex;justify-content:space-between;align-items:center;pointer-events:none"><img data-zone="logo" src="../../assets/logo/svg/fama-academy-horizontal-white.svg" alt="FAMA Academy" style="height:26px"><span data-zone="topline" style="font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;color:#FFFFFF">Madrid · Barcelona</span></div>
<div data-zone="band" style="position:absolute;left:0;right:0;bottom:0;height:540px;background:#000000;color:#FFFFFF">
<div style="position:absolute;left:108px;right:108px;top:72px;bottom:108px;display:flex;flex-direction:column;justify-content:space-between">
<div><span style="display:inline-block;font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;border-top:1px solid currentColor;padding-top:14px;opacity:.7">01 · Openday</span><div style="font:800 128px/0.86 Syne,Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-0.05em;margin-top:36px" data-fit="1">Openday</div><div style="font:300 40px/1.2 'Space Grotesk',Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.14em;margin-top:24px">Madrid · Barcelona</div></div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px"><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em">12 Oct 2026 · 18:00 h</span><span style="font:400 22px/1.4 Roboto,system-ui,sans-serif;opacity:.8">Reserva tu plaza en famaacademy.es</span></div><img data-zone="mark" src="../../assets/logo/svg/fama-academy-mark-white.svg" alt="" style="height:52px"></div>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;photoShare&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tall&quot;,&quot;half&quot;,&quot;short&quot;],&quot;default&quot;:&quot;tall&quot;,&quot;tsType&quot;:&quot;'tall'|'half'|'short'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;band&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;black&quot;,&quot;white&quot;],&quot;default&quot;:&quot;black&quot;,&quot;tsType&quot;:&quot;'black'|'white'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;blackAndWhite&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Photo&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() { this.apply(); this.fitAll(); if (document.fonts) document.fonts.ready.then(() => this.fitAll()); window.addEventListener('resize', () => this.fitAll()); }
  componentDidUpdate() { this.apply(); this.fitAll(); }
  apply() {
    const r = this.rootRef.current; if (!r) return;
    const q = z => r.querySelector('[data-zone="' + z + '"]');
    const band = this.props.band ?? 'black';
    const share = this.props.photoShare ?? 'tall';
    const bw = this.props.blackAndWhite ?? true;
    const photoH = share === 'tall' ? 810 : share === 'half' ? 675 : 540;
    const inv = band === 'black';
    const base = '../../assets/logo/svg/';
    q('photo').style.height = photoH + 'px'; q('photo').style.filter = bw ? 'grayscale(1)' : 'none';
    const b = q('band'); b.style.height = (1350 - photoH) + 'px'; b.style.background = inv ? '#000000' : '#FFFFFF'; b.style.color = inv ? '#FFFFFF' : '#000000';
    q('mark').src = base + (inv ? 'fama-academy-mark-white.svg' : 'fama-academy-mark-black.svg');
  }

  fitAll() {
    const r = this.rootRef.current; if (!r) return;
    r.querySelectorAll('[data-fit]').forEach(h => {
      const p = h.parentElement, cs = getComputedStyle(p);
      const box = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); if (box <= 0) return;
      if (!h.dataset.max) h.dataset.max = parseFloat(getComputedStyle(h).fontSize);
      const probe = document.createElement('span'); probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit';
      const nowrap = getComputedStyle(h).whiteSpace === 'nowrap';
      const words = h.textContent.trim().split(/\s+/); probe.textContent = nowrap ? words.join(' ') : words.reduce((a, b) => b.length > a.length ? b : a, '');
      h.appendChild(probe); let s = +h.dataset.max; h.style.fontSize = s + 'px';
      while (s > 20 && probe.getBoundingClientRect().width > box) { s -= 2; h.style.fontSize = s + 'px'; }
      probe.remove();
    });
  }
  renderVals() { return { rootRef: this.rootRef }; }
}
</script>
</body>
</html>
