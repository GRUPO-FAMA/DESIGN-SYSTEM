<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Instagram story 9:16" description="1080×1920 · full-bleed B/W photo · black band with Syne headline + CTA in the lower safe zone" -->
<helmet><script src="./ds-base.js"></script><script src="../shared/image-slot.js"></script><style>body{margin:0;background:#F1F1F1}</style></helmet>
<div ref="{{ rootRef }}" style="width:1080px;height:1920px;background:#000000;position:relative;overflow:hidden;font-family:Roboto,system-ui,sans-serif;color:#FFFFFF">
<div data-zone="photo" style="position:absolute;inset:0;filter:grayscale(1)"><image-slot id="ig-story-photo" shape="rect" placeholder="Fotografía vertical · rostro en el tercio superior"></image-slot></div>
<div style="position:absolute;left:108px;right:108px;top:192px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;pointer-events:none"><span style="font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em">Nº 01</span><img src="../../assets/logo/svg/fama-academy-horizontal-white.svg" alt="FAMA Academy" style="height:28px"><span style="font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;text-align:right">Madrid · Barcelona</span></div>
<div data-zone="band" style="position:absolute;left:0;right:0;bottom:0;height:800px;background:#000000;color:#FFFFFF">
<div style="position:absolute;left:108px;right:108px;top:96px;bottom:192px;display:flex;flex-direction:column;justify-content:space-between">
<div><span style="display:inline-block;font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;border-top:1px solid currentColor;padding-top:14px;opacity:.7">02 · Máster</span><div style="font:800 136px/0.86 Syne,Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-0.05em;margin-top:36px" data-fit="1">Máster Modelo</div><div style="font:300 40px/1.2 'Space Grotesk',Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.14em;margin-top:24px">Profesional</div></div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px"><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 20px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em">Inicio octubre 2026</span><span style="font:400 24px/1.4 Roboto,system-ui,sans-serif;opacity:.8">Plazas limitadas · famaacademy.es</span></div><span data-zone="cta" style="display:inline-flex;align-items:center;justify-content:center;height:72px;padding:0 44px;border:1px solid #FFFFFF;color:#FFFFFF;font:500 18px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.28em;white-space:nowrap">Solicitar plaza</span></div>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;bandSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;compact&quot;,&quot;regular&quot;,&quot;large&quot;],&quot;default&quot;:&quot;regular&quot;,&quot;tsType&quot;:&quot;'compact'|'regular'|'large'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;solidCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;blackAndWhite&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Photo&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() { this.apply(); this.fitAll(); if (document.fonts) document.fonts.ready.then(() => this.fitAll()); window.addEventListener('resize', () => this.fitAll()); }
  componentDidUpdate() { this.apply(); this.fitAll(); }
  apply() {
    const r = this.rootRef.current; if (!r) return;
    const q = z => r.querySelector('[data-zone="' + z + '"]');
    const size = this.props.bandSize ?? 'regular';
    const solid = this.props.solidCta ?? false;
    const bw = this.props.blackAndWhite ?? true;
    q('band').style.height = (size === 'regular' ? 800 : size === 'compact' ? 640 : 960) + 'px';
    q('photo').style.filter = bw ? 'grayscale(1)' : 'none';
    const c = q('cta'); c.style.background = solid ? '#FFFFFF' : 'transparent'; c.style.color = solid ? '#000000' : '#FFFFFF';
  }

  fitAll() {
    const r = this.rootRef.current; if (!r) return;
    r.querySelectorAll('[data-fit]').forEach(h => {
      const p = h.parentElement, cs = getComputedStyle(p);
      const box = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); if (box <= 0) return;
      if (!h.dataset.max) h.dataset.max = parseFloat(getComputedStyle(h).fontSize);
      const probe = document.createElement('span'); probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit';
      const nowrap = getComputedStyle(h).whiteSpace === 'nowrap';
      const words = h.textContent.trim().split(/\s+/); probe.textContent = nowrap ? words.join(' ') : words.reduce((a, b) => b.length > a.length ? b : a, '');
      h.appendChild(probe); let s = +h.dataset.max; h.style.fontSize = s + 'px';
      while (s > 20 && probe.getBoundingClientRect().width > box) { s -= 2; h.style.fontSize = s + 'px'; }
      probe.remove();
    });
  }
  renderVals() { return { rootRef: this.rootRef }; }
}
</script>
</body>
</html>
