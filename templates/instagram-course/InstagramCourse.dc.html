<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Instagram curso 4:5" description="1080×1350 · anuncio de programa · foto 3:4 B/W a la izquierda, título Syne y datos a la derecha · blanco" -->
<helmet><script src="./ds-base.js"></script><script src="../shared/image-slot.js"></script><style>body{margin:0;background:#F1F1F1}</style></helmet>
<div ref="{{ rootRef }}" style="width:1080px;height:1350px;background:#FFFFFF;color:#000000;position:relative;overflow:hidden;font-family:Roboto,system-ui,sans-serif">
<div style="position:absolute;left:108px;right:108px;top:108px;bottom:108px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:40px">
<div style="display:flex;justify-content:space-between;align-items:center"><img data-zone="logo" src="../../assets/logo/svg/fama-academy-horizontal-black.svg" alt="FAMA Academy" style="height:24px"><span style="font:500 16px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;opacity:.7">02 · Máster</span></div>
<div style="display:grid;grid-template-columns:5fr 6fr;gap:48px;min-height:0">
<div data-zone="photo" style="position:relative;filter:grayscale(1)"><image-slot id="ig-course-photo" shape="rect" placeholder="Fotografía 3:4"></image-slot></div>
<div style="display:flex;flex-direction:column;justify-content:space-between"><div><div style="font:800 96px/0.86 Syne,Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-0.05em" data-fit="1">Máster Modelo Profe­sional</div><div style="font:300 30px/1.2 'Space Grotesk',Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.14em;margin-top:24px">Madrid · Barcelona</div></div>
<dl style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:14px 28px;font:400 20px/1.4 Roboto,system-ui,sans-serif"><dt style="font:500 14px/1.6 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;opacity:.7">Inicio</dt><dd style="margin:0">Octubre 2026</dd><dt style="font:500 14px/1.6 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;opacity:.7">Formato</dt><dd style="margin:0">Presencial · grupos reducidos</dd><dt style="font:500 14px/1.6 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.26em;opacity:.7">Incluye</dt><dd style="margin:0">Book profesional · castings</dd></dl></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid currentColor;padding-top:28px"><span style="font:400 20px/1.4 Roboto,system-ui,sans-serif;opacity:.8">Más información en famaacademy.es</span><span data-zone="cta" style="display:inline-flex;align-items:center;justify-content:center;height:64px;padding:0 40px;border:1px solid currentColor;font:500 16px/1 Roboto,system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.28em;white-space:nowrap">Solicitar plaza</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;inverse&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;blackAndWhite&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Photo&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() { this.apply(); this.fitAll(); if (document.fonts) document.fonts.ready.then(() => this.fitAll()); window.addEventListener('resize', () => this.fitAll()); }
  componentDidUpdate() { this.apply(); this.fitAll(); }
  apply() {
    const r = this.rootRef.current; if (!r) return;
    const inverse = this.props.inverse ?? false;
    const bw = this.props.blackAndWhite ?? true;
    r.style.background = inverse ? '#000000' : '#FFFFFF'; r.style.color = inverse ? '#FFFFFF' : '#000000';
    r.querySelector('[data-zone="photo"]').style.filter = bw ? 'grayscale(1)' : 'none';
    r.querySelector('[data-zone="logo"]').src = '../../assets/logo/svg/' + (inverse ? 'fama-academy-horizontal-white.svg' : 'fama-academy-horizontal-black.svg');
  }

  fitAll() {
    const r = this.rootRef.current; if (!r) return;
    r.querySelectorAll('[data-fit]').forEach(h => {
      const p = h.parentElement, cs = getComputedStyle(p);
      const box = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); if (box <= 0) return;
      if (!h.dataset.max) h.dataset.max = parseFloat(getComputedStyle(h).fontSize);
      const probe = document.createElement('span'); probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit';
      const nowrap = getComputedStyle(h).whiteSpace === 'nowrap';
      const words = h.textContent.trim().split(/\s+/); probe.textContent = nowrap ? words.join(' ') : words.reduce((a, b) => b.length > a.length ? b : a, '');
      h.appendChild(probe); let s = +h.dataset.max; h.style.fontSize = s + 'px';
      while (s > 20 && probe.getBoundingClientRect().width > box) { s -= 2; h.style.fontSize = s + 'px'; }
      probe.remove();
    });
  }
  renderVals() { return { rootRef: this.rootRef }; }
}
</script>
</body>
</html>
