<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:230px}.row{display:flex;gap:16px;align-items:flex-start}.ph{position:relative;overflow:hidden;background:#F1F1F1}.ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:filter 1.3s cubic-bezier(.2,.6,.2,1),transform 1.6s cubic-bezier(.2,.6,.2,1)}.ph:hover img{filter:none;transform:scale(1.03)}.cap{font:var(--type-caption);color:var(--fg-muted);margin-top:8px}</style></head><body><div class="row"><div style="flex:0 0 130px"><div class="ph" style="aspect-ratio:4/5"><img src="https://famaacademy.es/wp-content/uploads/2026/08/FAMAACADEMY1.webp" alt=""></div><div class="cap">4:5 · cards</div></div><div style="flex:0 0 120px"><div class="ph" style="aspect-ratio:3/4"><img src="https://famaacademy.es/wp-content/uploads/2024/11/home-modelo-fama-alba-fama-academy.webp" alt=""></div><div class="cap">3:4 · models</div></div><div style="flex:1"><div class="ph" style="aspect-ratio:16/9"><img src="https://famaacademy.es/wp-content/uploads/2026/08/MON_4990-1-scaled-1-1024x683.webp" alt=""></div><div class="cap">16:9 · hero · full-bleed, no text over the image. Hover any photo: colour returns, 3 % scale.</div></div></div></body></html>
