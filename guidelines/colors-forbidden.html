<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:120px}.row{display:flex;gap:16px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label)}.cap{font:var(--type-caption);color:var(--fg-muted)}</style></head><body><div class="row" style="height:72px;align-items:stretch">
<div style="flex:1;background:linear-gradient(90deg,#000,#fff);position:relative"><div style="position:absolute;inset:0;display:grid;place-items:center;font:var(--type-label);letter-spacing:.18em;text-transform:uppercase;color:#fff;mix-blend-mode:difference">Gradientes ✕</div></div>
<div style="flex:1;background:#C8102E;display:grid;place-items:center;color:#fff;font:var(--type-label);letter-spacing:.18em;text-transform:uppercase">Color saturado ✕</div>
<div style="flex:1;background:repeating-linear-gradient(45deg,#F1F1F1 0 6px,#fff 6px 12px);display:grid;place-items:center;font:var(--type-label);letter-spacing:.18em;text-transform:uppercase">Texturas ✕</div>
<div style="flex:1;background:#000;box-shadow:0 12px 32px rgba(0,0,0,.4);border-radius:16px;display:grid;place-items:center;color:#fff;font:var(--type-label);letter-spacing:.18em;text-transform:uppercase">Sombra · radio ✕</div></div></body></html>
