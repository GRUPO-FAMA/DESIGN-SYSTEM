<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:150px}.row{display:flex;gap:16px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label)}.cap{font:var(--type-caption);color:var(--fg-muted)}</style></head><body><div class="row" style="height:102px">

<div style="flex:3;background:#000000;color:#fff;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="lbl">Black · 30%</span><span class="cap" style="color:#fff">#000000 · --black</span></div>
<div style="flex:1.5;background:#F1F1F1;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="lbl">Gray · 10%</span><span class="cap">#F1F1F1</span></div></div></body></html>
