<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:150px}.row{display:flex;gap:16px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label)}.cap{font:var(--type-caption);color:var(--fg-muted)}</style></head><body><div class="row" style="align-items:center;gap:24px"><div style="width:96px;height:96px;background:#F1F1F1;display:grid;place-items:center" class="cap">radius 0</div><div style="width:96px;height:96px;border:1px solid #000;display:grid;place-items:center" class="cap">1px #000</div><div style="width:96px;height:96px;border:1px solid #E4E4E4;display:grid;place-items:center" class="cap">1px #E4E4E4</div><div style="width:96px;height:96px;background:#000;color:#fff;display:grid;place-items:center" class="cap" >inverse</div><div style="width:96px;height:96px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center" class="cap" >only circle</div><p class="cap" style="max-width:110px">--shadow-none. Depth = gray surface or black block.</p></div></body></html>
