<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:170px}.row{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.cap{font:var(--type-caption);color:var(--fg-muted)}.btn{display:inline-flex;align-items:center;height:52px;padding:0 32px;border:1px solid #000;font:var(--type-button);text-transform:uppercase;letter-spacing:var(--tracking-button)}.c{display:flex;flex-direction:column;gap:8px}</style></head><body><div class="row"><div class="c"><span class="btn">Reservar</span><span class="cap">Outline · rest</span></div><div class="c"><span class="btn" style="background:#000;color:#fff">Reservar</span><span class="cap">Outline · hover (fills)</span></div><div class="c"><span class="btn" style="background:#000;color:#fff">Reservar</span><span class="cap">Solid · rest</span></div><div class="c"><span class="btn">Reservar</span><span class="cap">Solid · hover (hollows)</span></div><div class="c"><span class="btn" style="border-color:#9A9A9A;color:#9A9A9A">Reservar</span><span class="cap">Disabled</span></div><div class="c" style="margin-left:auto"><span class="cap">Reveal: opacity 0→1, translateY 32→0, 1.3 s, ease .2 .6 .2 1, stagger 100 ms</span><span class="cap">Curtain: monogram on black, lifts in 1.2 s (ease .7 0 .2 1)</span><span class="cap">Ticker: linear, 48 s per loop</span></div></div></body></html>
