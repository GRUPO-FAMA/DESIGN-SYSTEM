<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:200px}.row{display:flex;gap:16px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label)}.cap{font:var(--type-caption);color:var(--fg-muted)}</style></head><body><div class="row" style="height:152px">
